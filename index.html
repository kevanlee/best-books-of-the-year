<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Values Exercise</title>
    <meta
      name="description"
      content="A guided exercise to clarify the values that matter most to you in life, work, or both."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <img
            class="brand-mark"
            src="img/bonfire-logo-red.png"
            alt="Bonfire logo"
          />
          <div class="brand-title">Values Exercise</div>
        </div>
        <div id="progress" class="progress-wrap" aria-label="Exercise progress"></div>
      </header>

      <main id="app" class="app-shell" aria-live="polite"></main>
    </div>

    <footer class="page-footer">
      <img
        class="page-footer-mascot"
        src="img/Walking - tan.png"
        alt="Bonfire mascot walking"
      />
      <p class="page-footer-copy">Built by Shannon + Kevan at <a href="https://aroundthebonfire.co">Bonfire</a></p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <div class="noscript">
        This prototype needs JavaScript enabled to save progress and guide you through the
        exercise.
      </div>
    </noscript>

    <script src="main.js"></script>
  </body>
  </html>
