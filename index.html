<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Professional Values Exercise</title>
    <meta
      name="description"
      content="A guided exercise to clarify the values that matter most to you at work."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <p class="eyebrow">Workshop Prototype</p>
          <h1 class="brand-title">Professional Values Exercise</h1>
        </div>
        <div id="progress" class="progress-wrap" aria-label="Exercise progress"></div>
      </header>

      <main id="app" class="app-shell" aria-live="polite"></main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <div class="noscript">
        This prototype needs JavaScript enabled to save progress and guide you through the
        exercise.
      </div>
    </noscript>

    <script src="main.js"></script>
  </body>
  </html>
